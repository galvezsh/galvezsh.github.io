<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>

        <link rel="shortcut icon" href="../../resources/images/favicon.jpg" type="image/x-icon">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <!-- <link rel="stylesheet" href="../../css/docs.css"> -->
        <script defer src="../../js/documents/lusitano.js"></script>
    </head>

    <style>

        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            background: white;
            color: black;
            margin: 0;
            font-size: 20px;
        }

        main {
            width: 120vh;
            margin: 0 auto;
        }

        p {
            color: gray;
            line-height: 1.5;
        }

        .container {
            margin-bottom: 80px;
            font-size: 1.3rem;
        }

        .container > h1 {
            text-align: center;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            padding-top: 8px;
            padding-bottom: 24px;
            background-color: white;
        }

        header * {
            margin: 0;
            padding: 0;
        }

        header nav {
            margin: 0 auto;
        }

        header nav ul {
            list-style: none;
        }
        
        header nav ul li {
            display: inline;
            margin: 0 1rem;
        }
        
        header nav ul li a {
            text-decoration: none;
            color: grey;
        }

        header nav ul li a:hover {
            text-decoration: underline;
        }

        #introduction {
            background: url('../../resources/images/lusitano/lusitano.jpeg') no-repeat center center/cover;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        #introduction h1 {
            font-size: 2.8em;
            margin: 0;
        }

        #introduction p {
            font-size: 1.4em;
            color: white;
        }

        #origin {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #origin img {
            width: 420px;
            margin-right: 50px;
            border-radius: 10px;
        }

        #purpose {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #purpose h1, #purpose h2 {
            text-align: right;
        }

        #purpose img {
            width: 420px;
            margin-left: 50px;
            border-radius: 10px;
        }

        /* Carousel Styles */
        #anatomy {
            position: relative;
            overflow: hidden;
            padding-bottom: 2px;
        }

        .carousel-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            min-height: 400px;
        }

        .carousel-slides {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        /* Imágenes de fondo para cada parte anatómica */
        #anatomy .carousel-slide:nth-child(1) {
            background-image: url('../../resources/images/lusitano/anatomy_cabeza.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #anatomy .carousel-slide:nth-child(2) {
            background-image: url('../../resources/images/lusitano/anatomy_cuello.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #anatomy .carousel-slide:nth-child(3) {
            background-image: url('../../resources/images/lusitano/anatomy_tronco.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #anatomy .carousel-slide:nth-child(4) {
            background-image: url('../../resources/images/lusitano/anatomy_partes.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #anatomy .carousel-slide:nth-child(5) {
            background-image: url('../../resources/images/lusitano/anatomy_grupa.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #anatomy .carousel-slide:nth-child(6) {
            background-image: url('../../resources/images/lusitano/anatomy_extremidades.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .carousel-slide {
            display: none;
            transform: translateX(100%);
            transition: transform 0.6s ease-in-out, opacity 0.6s ease-in-out;
            opacity: 0;
        }

        .carousel-slide.active {
            display: block;
            transform: translateX(0);
            opacity: 1;
            animation: slideIn 0.6s ease-in-out;
        }

        /* Animaciones de deslizamiento */
        .carousel-slides.slide-right .carousel-slide.active {
            animation: slideInFromRight 0.6s ease-in-out;
        }

        .carousel-slides.slide-left .carousel-slide.active {
            animation: slideInFromLeft 0.6s ease-in-out;
        }

        @keyframes slideInFromRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInFromLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-content {
            padding: 40px 80px;
            text-align: justify;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            margin: 20px;
            min-height: 400px;
        }

        .slide-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: black;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            z-index: 10;
        }

        .carousel-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .carousel-btn-left {
            left: 10px;
        }

        .carousel-btn-right {
            right: 10px;
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: lightgray;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .indicator:hover {
            background: gray;
            transform: scale(1.2);
        }

        .indicator.active {
            background: black;
            transform: scale(1.3);
        }

        /* Coats Section Styles */
        #coats {
            position: relative;
            overflow: hidden;
            padding-bottom: 2px;
        }

        #coats .carousel-slides {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #coats .carousel-slide {
            width: 100%;
            height: 100%;
        }

        /* Imágenes de fondo para cada capa - aplicadas directamente al slide */
        #coats .carousel-slide:nth-child(1) {
            background-image: url('../../resources/images/lusitano/coat_torda.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #coats .carousel-slide:nth-child(2) {
            background-image: url('../../resources/images/lusitano/coat_castano.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #coats .carousel-slide:nth-child(3) {
            background-image: url('../../resources/images/lusitano/coat_negra.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #coats .carousel-slide:nth-child(4) {
            background-image: url('../../resources/images/lusitano/coat_alazan.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #coats .carousel-slide:nth-child(5) {
            background-image: url('../../resources/images/lusitano/coat_bayo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .coat-content {
            min-height: auto !important;
            padding: 30px 60px !important;
            max-width: 600px;
            margin: 0 auto !important;
            text-align: center;
        }

        .coat-content h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .coat-content p {
            font-size: 1rem;
            line-height: 1.6;
            text-align: center;
        }

        /* FAQ Styles */
        #questions {
            max-width: 900px;
            margin: 80px auto;
        }

        .faq-container {
            margin-top: 40px;
        }

        .faq-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .faq-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease;
        }

        .faq-question:hover {
            background: #f8f8f8;
        }

        .faq-question span {
            font-weight: 600;
            font-size: 1.1rem;
            color: black;
        }

        .faq-icon {
            font-size: 1rem;
            color: gray;
            transition: transform 0.3s ease;
        }

        .faq-item.active .faq-icon {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
            padding: 0 28px;
        }

        .faq-item.active .faq-answer {
            padding: 0 28px 24px 28px;
        }

        .faq-answer p {
            margin: 0;
            line-height: 1.7;
            color: gray;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 1rem;
            border-top: 1px solid #e0e0e0;
        }

    </style>

    <body>
        <main>
            
            <header></header>

            <div class="container" id="introduction"></div>

            <div class="container" id="origin"></div>

            <div class="container" id="purpose"></div>

            <div class="container" id="anatomy"></div>

            <div class="container" id="coats"></div>

            <div class="container" id="questions"></div>

            <footer></footer>
            
        </main>
    </body>
</html>
