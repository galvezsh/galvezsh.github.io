<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>

        <link rel="shortcut icon" href="/resources/images/favicon.jpg" type="image/x-icon">
        <link rel="stylesheet" href="/css/errors.css">
    </head>

    <body>
        <div class="error-container"></div>
    </body>
    
    <script type="module">
        import { Cookie, Strings } from "/js/engine.js";

        const STRINGS = new Strings( new Cookie().getCookie( "locale" ) );

        document.querySelector("div.error-container").innerHTML = createErrorContent();
        document.title = STRINGS.websiteName + ": " + STRINGS.error404Title;

        function createErrorContent() {
            return `
                <h1>Error 404</h1>
                ${STRINGS.error404Label}
            `;
        }
    </script>
</html>
